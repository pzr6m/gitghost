name: GitGhost Secret Scan
description: Catch leaked API keys in AI-built apps - hardcoded keys, NEXT_PUBLIC_/VITE_ secrets, Supabase admin keys and .env files.
author: Omar
branding:
  icon: shield
  color: purple

inputs:
  mode:
    description: '"history" scans every commit (needs actions/checkout with fetch-depth: 0); "files" scans the current files.'
    default: history

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - shell: bash
      run: |
        if [ "${{ inputs.mode }}" = "files" ]; then gitghost scan .; else gitghost scan --history; fi
