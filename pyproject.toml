[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitghost-cli"
dynamic = ["version"]
description = "Catches the API keys AI-built apps leak: hardcoded keys, secrets in NEXT_PUBLIC_/VITE_ variables, Supabase service keys and .env files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Omar" }]
keywords = ["git", "secrets", "pre-commit", "security", "api-keys", "supabase", "nextjs", "vite", "vibe-coding", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["typer>=0.9", "rich>=13"]

[project.urls]
Homepage = "https://pzr6m.github.io/gitghost/"
Source = "https://github.com/pzr6m/gitghost"
Issues = "https://github.com/pzr6m/gitghost/issues"
Releases = "https://github.com/pzr6m/gitghost/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gitghost = "gitghost.cli:app"

[tool.setuptools]
packages = ["gitghost"]

[tool.setuptools.dynamic]
version = { attr = "gitghost.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
