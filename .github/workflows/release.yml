# Releases happen automatically: bump __version__ in gitghost/__init__.py and push to main.
# If tag v<version> does not exist yet, this workflow builds the package and creates the tag
# + a GitHub Release with the files attached (release notes are generated from the commits).
#  - PyPI: also publishes once you've set it up (one time):
#      1. pypi.org -> Your projects -> Publishing -> add a Trusted Publisher for this repo
#         (workflow: release.yml, environment: pypi)
#      2. GitHub repo -> Settings -> Variables -> Actions -> add PYPI_PUBLISH = true
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('gitghost/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION already released"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "releasing v$VERSION"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  github-release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: GitGhost v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

  pypi:
    needs: [check, build]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
