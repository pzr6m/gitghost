# Publishes to PyPI when you push a version tag, e.g.:  git tag v0.2.0 && git push --tags
# One-time setup: on pypi.org add a "Trusted Publisher" for this repo
# (workflow: release.yml, environment: pypi). No API tokens needed.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
